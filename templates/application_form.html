{% extends 'base.html' %}{% block content %}<header><div><p class="eyebrow">{{'EDIT' if a else 'NEW'}} APPLICATION</p><h1>{{a.position if a else 'Add an application'}}</h1></div></header><form method="post" class="panel form-grid"><label>Company*<input name="company" required value="{{a.company if a else ''}}"></label><label>Position*<input name="position" required value="{{a.position if a else ''}}"></label><label>Job URL<input type="url" name="job_url" value="{{a.job_url if a else ''}}"></label><label>Salary range<input name="salary" value="{{a.salary if a else ''}}"></label><label>Location<input name="location" value="{{a.location if a else ''}}"></label><label>Work arrangement<select name="work_arrangement">{% for x in ['Remote','Hybrid','Onsite'] %}<option {% if a and a.work_arrangement==x %}selected{% endif %}>{{x}}</option>{% endfor %}</select></label><label>Employment type<select name="employment_type">{% for x in ['Full-time','Part-time','Contract','Casual','Internship'] %}<option {% if a and a.employment_type==x %}selected{% endif %}>{{x}}</option>{% endfor %}</select></label><label>Date applied<input type="date" name="date_applied" value="{{a.date_applied.isoformat() if a and a.date_applied else today}}"></label><label>Source<input name="source" value="{{a.source if a else ''}}" placeholder="Seek, LinkedIn, recruiter..."></label><label>Status<select name="status">{% for s in statuses %}<option {% if a and a.status==s %}selected{% endif %}>{{s}}</option>{% endfor %}</select></label><label>Priority<select name="priority">{% for p in priorities %}<option {% if a and a.priority==p %}selected{% endif %}>{{p}}</option>{% endfor %}</select></label><label>Recruiter / contact<input name="recruiter" value="{{a.recruiter if a else ''}}"></label><label>Contact email<input type="email" name="contact_email" value="{{a.contact_email if a else ''}}"></label><label>Follow-up date<input type="date" name="follow_up_date" value="{{a.follow_up_date.isoformat() if a and a.follow_up_date else ''}}"></label><label>Resume version<input name="resume_version" value="{{a.resume_version if a else ''}}"></label><label>Cover letter<input name="cover_letter" value="{{a.cover_letter if a else ''}}"></label><label class="full">Technologies / skills<input name="skills" value="{{a.skills if a else ''}}" placeholder="React, Python, PostgreSQL..."></label><label class="full">Next action<input name="next_action" value="{{a.next_action if a else ''}}"></label><label class="full">Notes<textarea name="notes" rows="6">{{a.notes if a else ''}}</textarea></label><div class="full"><button>Save application</button> <a class="btn secondary" href="{{url_for('applications')}}">Cancel</a></div></form>{% endblock %}
