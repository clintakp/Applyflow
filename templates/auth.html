{% extends 'base.html' %}{% block content %}<div class="auth-card"><div class="brand big">Apply<span>Flow</span></div><h1>{{mode}}</h1><p>Turn your job search into a measurable pipeline.</p><form method="post"><label>Email<input type="email" name="email" required></label><label>Password<input type="password" name="password" minlength="6" required></label><button>{{mode}}</button></form><p>{% if mode=='Sign in' %}New here? <a href="{{url_for('register')}}">Create an account</a>{% else %}Already registered? <a href="{{url_for('login')}}">Sign in</a>{% endif %}</p></div>{% endblock %}
