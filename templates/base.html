<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}ApplyFlow{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"><script src="https://cdn.jsdelivr.net/npm/chart.js"></script></head><body>
{% if current_user.is_authenticated %}<aside><a class="brand" href="{{url_for('dashboard')}}">Apply<span>Flow</span></a><nav><a href="{{url_for('dashboard')}}">Dashboard</a><a href="{{url_for('applications')}}">Applications</a><a href="{{url_for('applications',view='kanban')}}">Pipeline</a><a href="{{url_for('analyser')}}">JD Analyser</a></nav><div class="side-bottom"><small>{{current_user.email}}</small><a href="{{url_for('logout')}}">Sign out</a></div></aside>{% endif %}
<main class="{% if not current_user.is_authenticated %}auth-main{% endif %}">{% with messages=get_flashed_messages() %}{% if messages %}<div class="flash">{{messages[-1]}}</div>{% endif %}{% endwith %}{% block content %}{% endblock %}</main></body></html>
